---
# DaemonSet — Distribute block-af-alg.json to every node (CVE-2026-31431)
#
# Writes the AF_ALG-blocking seccomp profile to the kubelet seccomp root on
# every node so that Localhost seccomp profile references resolve correctly.
#
# The default kubelet seccomp root is /var/lib/kubelet/seccomp. Override via
# the NODE_SECCOMP_ROOT env var if your cluster uses a non-standard path
# (e.g. RKE2 uses /var/lib/rancher/rke2/agent/kubelet/seccomp).
#
# The init container writes the file and exits; the pause container keeps the
# pod Running so the DaemonSet remains visible for health monitoring.
#
# Apply:
#   kubectl apply -f templates/daemonset-distribute-profile.yaml
#
# Verify on a node:
#   cat /var/lib/kubelet/seccomp/block-af-alg.json
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: distribute-af-alg-seccomp
  namespace: kube-system
  labels:
    app.kubernetes.io/name: distribute-af-alg-seccomp
    app.kubernetes.io/component: security
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: distribute-af-alg-seccomp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: distribute-af-alg-seccomp
        app.kubernetes.io/component: security
    spec:
      # Run on every node including control-plane.
      tolerations:
        - operator: Exists
      initContainers:
        - name: install-profile
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              set -eu
              DEST="${NODE_SECCOMP_ROOT}/block-af-alg.json"
              mkdir -p "${NODE_SECCOMP_ROOT}"
              cp /profiles/block-af-alg.json "${DEST}"
              echo "Installed seccomp profile to ${DEST}"
          env:
            - name: NODE_SECCOMP_ROOT
              value: /var/lib/kubelet/seccomp
          volumeMounts:
            - name: profile
              mountPath: /profiles
              readOnly: true
            - name: seccomp-root
              mountPath: /var/lib/kubelet/seccomp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: false  # needs write access to host path
            runAsUser: 0
      containers:
        - name: pause
          image: gcr.io/google_containers/pause:3.9
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              cpu: 10m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 65534
      volumes:
        - name: profile
          configMap:
            name: af-alg-seccomp-profile
        - name: seccomp-root
          hostPath:
            path: /var/lib/kubelet/seccomp
            type: DirectoryOrCreate
      priorityClassName: system-node-critical
